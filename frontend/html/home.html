<!doctype html>
<html lang="en">
    <head>
        <title>The rabbit in the hole</title>

        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
        />
        <meta
            name="description"
            content="The rabbit in the hole - face-to-face WebRTC real-time cam-2-cam video calls and screen sharing."
        />

        <meta property="og:type" content="app-webrtc" />
        <meta property="og:site_name" content="The rabbit in the hole" />
        <meta property="og:title" content="Click the link to join this call." />
        <meta property="og:description" content="Face-to-face WebRTC video calls." />
        <meta property="og:image" content="../images/background.jpg" />
        <meta property="og:url" content="https://live-six-hole.onrender.com" />

        <link rel="apple-touch-icon" href="../images/favicon.png" />
        <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />

        <link rel="stylesheet" href="../css/home.css" />
        <link rel="stylesheet" href="../css/common.css" />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
        />

        <script async src="../js/stats.js"></script>

        <script
            defer
            src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"
        ></script>

        <script
            defer
            src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"
        ></script>

        <script defer src="../js/storage.js"></script>
        <script defer src="../js/home.js"></script>
    </head>

    <body
        style="
            margin: 0;
            min-height: 100vh;
            background-image: url('../images/background.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        "
    >

        <form id="joinForm" autocomplete="off" class="join-form">

            <div class="form-header">
                <div class="form-logo">
                    <img
                        alt="../images/logo.svg"
                        alt="The rabbit in the hole"
                    />
                </div>

                <h2>The rabbit in the hole</h2>
                <p>face-to-face</p>
            </div>

            <div class="input-group">
                <label for="roomIdInput">
                    <i class="fas fa-door-open"></i>
                    rabbit pit
                </label>

                <div class="input-container">
                    <input
                        id="roomIdInput"
                        type="text"
                        name="room"
                        placeholder="e.g. my-meeting"
                        maxlength="36"
                        required
                    />

                    <button
                        type="button"
                        id="randomRoomBtn"
                        class="input-btn"
                        title="Generate random room"
                        aria-label="Generate Random Room"
                    >
                        <i class="fa fa-random"></i>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="userNameInput">
                    <i class="fas fa-user"></i>
                    user name
                </label>

                <div class="input-container">
                    <input
                        id="userNameInput"
                        type="text"
                        name="name"
                        placeholder="Your display name"
                        maxlength="36"
                        required
                    />

                    <button
                        type="button"
                        id="randomUserBtn"
                        class="input-btn"
                        title="Generate random user"
                        aria-label="Generate Random User"
                    >
                        <i class="fa fa-random"></i>
                    </button>
                </div>
            </div>

            <div class="media-toggles">

                <button
                    type="button"
                    id="initAudioBtn"
                    class="media-toggle-btn"
                    title="Toggle microphone"
                    aria-label="Toggle microphone"
                    aria-pressed="true"
                >
                    <i class="fas fa-microphone"></i>
                    <span>Mic</span>
                </button>

                <button
                    type="button"
                    id="initVideoBtn"
                    class="media-toggle-btn"
                    title="Toggle camera"
                    aria-label="Toggle camera"
                    aria-pressed="true"
                >
                    <i class="fas fa-video"></i>
                    <span>Cam</span>
                </button>

            </div>

            <button
                type="submit"
                id="joinBtn"
                class="join-button"
            >
                <i class="fas fa-video"></i>
                <span>Rabbit♡jump♡in♡pit</span>
            </button>

            <div class="form-divider">
                <span>
                    <a
                        href="/privacy"
                        class="privacy-link"
                    >
                        Follow officially
                    </a>
                </span>
            </div>

            <button
                id="supportBtn"
                class="support-btn"
                type="button"
            >
                &copy; https://live-six-hole.onrender.com
            </button>

        </form>

    </body>
</html>
