<!doctype html>
<html lang="en">
    <head>
        <title>The rabbit in the hole</title>

        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
        />
        <meta
            name="description"
            content="The rabbit in the hole - face-to-face WebRTC real-time cam-2-cam video calls and screen sharing."
        />

        <meta property="og:type" content="app-webrtc" />
        <meta property="og:site_name" content="The rabbit in the hole" />
        <meta property="og:title" content="Click the link to join this call." />
        <meta property="og:description" content="Face-to-face WebRTC video calls." />
        <meta property="og:image" content="../images/background.jpg" />
        <meta property="og:url" content="https://live-six-hole.onrender.com" />

        <link rel="apple-touch-icon" href="../images/favicon.png" />
        <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />

        <link rel="stylesheet" href="../css/home.css" />
        <link rel="stylesheet" href="../css/common.css" />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
        />

        <script async src="../js/stats.js"></script>

        <script
            defer
            src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"
        ></script>

        <script
            defer
            src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"
        ></script>

        <script defer src="../js/storage.js"></script>
        <script defer src="../js/home.js"></script>
    </head>

    <body
        style="
            margin: 0;
            min-height: 100vh;
            background-image: url('../images/background.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        "
    >

        <form id="joinForm" autocomplete="off" class="join-form">

            <div class="form-header">
                <div class="form-logo">
                    <img
                        src="../images/logo.svg"
                        alt="The rabbit in the hole"
                    />
                </div>

                <h2>The rabbit in the hole</h2>
                <p>face-to-face</p>
            </div>

            <div class="input-group">
                <label for="roomIdInput">
                    <i class="fas fa-door-open"></i>
                    The room 
                </label>

                <div class="input-container">
                    <input
                        id="roomIdInput"
                        type="text"
                        name="room"
                        placeholder="e.g. my-meeting"
                        maxlength="36"
                        required
                    />

                    <button
                        type="button"
                        id="randomRoomBtn"
                        class="input-btn"
                        title="Generate random room"
                        aria-label="Generate Random Room"
                    >
                        <i class="fa fa-random"></i>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="userNameInput">
                    <i class="fas fa-user"></i>
                     my name 
                </label>

                <div class="input-container">
                    <input
                        id="userNameInput"
                        type="text"
                        name="name"
                        placeholder="Your display name"
                        maxlength="36"
                        required
                    />

                    <button
                        type="button"
                        id="randomUserBtn"
                        class="input-btn"
                        title="Generate random user"
                        aria-label="Generate Random User"
                    >
                        <i class="fa fa-random"></i>
                    </button>
                </div>
            </div>

            <div class="media-toggles">

                <button
                    type="button"
                    id="initAudioBtn"
                    class="media-toggle-btn"
                    title="Toggle microphone"
                    aria-label="Toggle microphone"
                    aria-pressed="true"
                >
                    <i class="fas fa-microphone"></i>
                    <span>Mic</span>
                </button>

                <button
                    type="button"
                    id="initVideoBtn"
                    class="media-toggle-btn"
                    title="Toggle camera"
                    aria-label="Toggle camera"
                    aria-pressed="true"
                >
                    <i class="fas fa-video"></i>
                    <span>Cam</span>
                </button>

            </div>

            <button
                type="submit"
                id="joinBtn"
                class="join-button"
            >
                <i class="fas fa-video"></i>
                <span>Grab the rabbit's tail</span>
            </button>

            <div class="form-divider">
                <span>
                    <a
                        href="/privacy"
                        class="privacy-link"
                    >
                        Follow officially
                    </a>
                </span>
            </div>

            <button
                id="supportBtn"
                class="support-btn"
                type="button"
            >
                &copy; https://live-six-hole.onrender.com
            </button>

        </form>
<!-- 1. الزر العائم لفتح الشات (يظهر إذا تم إخفاء الشات مؤقتاً) -->
<button id="toggle-chat-btn" onclick="togglePublicChat()" style="position: fixed; bottom: 20px; right: 20px; z-index: 10000; background: rgba(43, 108, 176, 0.85); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.3); font-family: system-ui; direction: rtl; display: none; align-items: center; gap: 8px; transition: all 0.3s ease;">
    💬 <span>إظهار الدردشة العامة</span>
</button>

<!-- 2. صندوق الشات الزجاجي الشفاف -->
<div id="public-chat-box" style="position: fixed; bottom: 20px; right: 20px; width: 380px; height: 550px; max-width: 90vw; max-height: 85vh; z-index: 9999; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2); border-radius: 16px; overflow: hidden; background: rgba(255, 255, 255, 0.45); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); font-family: system-ui; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column;">
    
    <!-- شريط التحكم العلوي -->
    <div style="background: rgba(26, 32, 44, 0.75); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); color: white; padding: 10px 15px; font-weight: bold; font-size: 14px; direction: rtl; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <span style="display: flex; align-items: center; gap: 6px;">💬 الدردشة العامة</span>
        
        <!-- أزرار التحكم الخصيصة -->
        <div style="display: flex; gap: 8px; direction: ltr;">
            <!-- زر ملء الشاشة -->
            <button onclick="maximizeChat()" title="ملء الشاشة" style="background: rgba(255,255,255,0.15); border: none; color: white; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">🗖</button>
            <!-- زر الإخفاء المؤقت (دون إغلاق) -->
            <button onclick="minimizeChat()" title="إخفاء مؤقت" style="background: rgba(255,255,255,0.15); border: none; color: white; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">—</button>
            <!-- زر الإغلاق النهائي -->
            <button onclick="closeChatCompletely()" title="إغلاق نهائي" style="background: rgba(229, 62, 62, 0.6); border: none; color: white; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: 0.2s;" onmouseover="this.style.background='rgba(229, 62, 62, 0.9)'" onmouseout="this.style.background='rgba(229, 62, 62, 0.6)'">✕</button>
        </div>
    </div>
    
    <!-- التضمين الفعلي للشات الشفاف -->
    <iframe src="https://tlk.io" style="width: 100%; flex-grow: 1; border: none; background: transparent;" allowtransparency="true"></iframe>
</div>

<!-- 3. أكواد وظائف التحكم (JavaScript) -->
<script>
var isMaximized = false;

// وظيفة الإخفاء المؤقت (يخفي الشات دون التأثير على الاتصال داخلها ويظهر زر الفتح)
function minimizeChat() {
    document.getElementById('public-chat-box').style.opacity = '0';
    document.getElementById('public-chat-box').style.transform = 'translateY(20px) scale(0.95)';
    setTimeout(function() {
        document.getElementById('public-chat-box').style.pointerEvents = 'none';
        document.getElementById('toggle-chat-btn').style.display = 'flex';
    }, 300);
}

// وظيفة إعادة الإظهار من الزر العائم
function togglePublicChat() {
    document.getElementById('public-chat-box').style.pointerEvents = 'auto';
    document.getElementById('public-chat-box').style.opacity = '1';
    document.getElementById('public-chat-box').style.transform = 'translateY(0) scale(1)';
    document.getElementById('toggle-chat-btn').style.display = 'none';
}

// وظيفة ملء الشاشة واستعادتها
function maximizeChat() {
    var chatBox = document.getElementById('public-chat-box');
    if (!isMaximized) {
        // تحويل إلى ملء الشاشة بالكامل
        chatBox.style.width = '100vw';
        chatBox.style.height = '100vh';
        chatBox.style.maxWidth = '100vw';
        chatBox.style.maxHeight = '100vh';
        chatBox.style.bottom = '0';
        chatBox.style.right = '0';
        chatBox.style.borderRadius = '0px';
        isMaximized = true;
    } else {
        // العودة للحجم الافتراضي الذكي
        chatBox.style.width = '380px';
        chatBox.style.height = '550px';
        chatBox.style.maxWidth = '90vw';
        chatBox.style.maxHeight = '85vh';
        chatBox.style.bottom = '20px';
        chatBox.style.right = '20px';
        chatBox.style.borderRadius = '16px';
        isMaximized = false;
    }
}

// وظيفة الإغلاق النهائي تماماً من الصفحة
function closeChatCompletely() {
    document.getElementById('public-chat-box').style.display = 'none';
    document.getElementById('toggle-chat-btn').style.display = 'none';
}
</script>

    </body>
</html>
