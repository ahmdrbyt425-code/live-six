<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://w3.org" xmlns:xlink="http://w3.org">
  <defs>
    <!-- الحفاظ على التدرج اللوني الغني الخاص بك -->
    <radialGradient cx="50%" cy="50%" r="70%" id="bunnyGrad">
      <stop stop-color="#FFD4CA" offset="0%"/>
      <stop stop-color="#FF8D74" offset="30%"/>
      <stop stop-color="#D262B4" offset="70%"/>
      <stop stop-color="#376DF9" offset="100%"/>
    </radialGradient>
  </defs>
  
  <g fill="url(#bunnyGrad)">
    <!-- الجسم الرئيسي على شكل قلب يمثل مؤخرة الأرنب -->
    <path d="M16 28 C13.5 25.5 4 17 4 11 C4 6.5 7.5 3 12 3 C14.5 3 15.5 4.5 16 5.5 C16.5 4.5 17.5 3 20 3 C24.5 3 28 6.5 28 11 C28 17 18.5 25.5 16 28 Z" />
    
    <!-- الأقدام اللطيفة في الأسفل المدمجة مع انحناءة القلب -->
    <ellipse cx="10" cy="22" rx="3" ry="4" transform="rotate(-15 10 22)" opacity="0.9"/>
    <ellipse cx="22" cy="22" rx="3" ry="4" transform="rotate(15 22 22)" opacity="0.9"/>
  </g>
  
  <!-- ذيل الأرنب الفروي الدائري في المنتصف بلون فاتح ومتدرج ليعطي مجسماً بارزاً -->
  <circle cx="16" cy="13" r="4.5" fill="#FFFFFF" opacity="0.95" />
  <circle cx="16" cy="13" r="3" fill="#FFD4CA" opacity="0.6" />
</svg>
